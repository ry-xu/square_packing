<title>Square Packing Lab</title>
<style>
  :root { --bg:#fbfbfa; --ink:#1a1a1a; --muted:#777; --line:#ddd; --wall:#b5651d; --accent:#1f6f78; --record:#c2410c; --flat:#a9c7da; --sq:#cfd6d9; --sqlock:#8f9aa0; --sqpart:#b0babf; --good:#2f7d4a; --warn:#a15c07;
          --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#141414; --ink:#e6e6e6; --muted:#8a8a8a; --line:#333; --wall:#e0a15a; --accent:#4fb3bc; --record:#f08a5d; --flat:#5f86a0; --sq:#4a5357; --sqlock:#2c3236; --sqpart:#3b4347; --good:#6cc48a; --warn:#e2a64a; } }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#141414; --ink:#e6e6e6; --muted:#8a8a8a; --line:#333; --wall:#e0a15a; --accent:#4fb3bc; --record:#f08a5d; --flat:#5f86a0; --sq:#4a5357; --sqlock:#2c3236; --sqpart:#3b4347; --good:#6cc48a; --warn:#e2a64a; }
  body { background: var(--bg); color: var(--ink); font: 12px/1.35 var(--mono); }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 12px; padding-inline: 16px; padding-block: 10px; max-width: 1300px; margin: 0 auto; align-items: start; }
  @media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
  canvas { width: min(100%, calc(100vh - 60px)); height: auto; max-width: 100%; aspect-ratio: 1; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .ro { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .ro b { color: var(--ink); font-weight: 500; }
  .side { display: grid; gap: 2px; }
  .h { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 10px; margin-top: 8px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  .r { display: grid; grid-template-columns: 92px 1fr 44px; gap: 6px; align-items: center; }
  .r input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); height: 14px; }
  .r output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .b { display: flex; flex-wrap: wrap; gap: 3px; }
  button { font: 12px var(--mono); background: none; color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  button[aria-pressed="true"], button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .num { width: 46px; font: 12px var(--mono); padding: 1px 3px; border: 1px solid var(--line); border-radius: 3px; background: none; color: var(--ink); }
  label.c { display: flex; gap: 4px; align-items: center; }
  .pad { display: grid; grid-template-columns: repeat(3, 24px); gap: 2px; }
  .pad button { padding: 1px 0; }
  .pill { font: inherit; }
  .pill { color: var(--ink); }
  details.adv summary { list-style: none; } details.adv summary::-webkit-details-marker { display: none; } details.adv summary::before { content: '▸ '; } details.adv[open] summary::before { content: '▾ '; } details.adv { display: grid; gap: 2px; }
  .legend-bar, .legend, .hint, header { display: none; }

  [hidden], #win[hidden] { display: none !important; }
  #win { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 10; padding-inline: 16px; }
  #win .box { background: var(--bg); color: var(--ink); border: 2px solid var(--record); max-width: 560px; width: 100%; padding: 16px; display: grid; gap: 8px; }
  #win h2 { margin: 0; font: 600 18px var(--mono); color: var(--record); }
  #win textarea { width: 100%; height: 120px; font: 11px var(--mono); background: none; color: var(--ink); border: 1px solid var(--line); resize: vertical; }
  body.frozen .wrap { pointer-events: none; filter: grayscale(.4); }
</style>

<div id="win" hidden role="alertdialog" aria-modal="true" aria-labelledby="win-h">
  <div class="box">
    <h2 id="win-h">Below the known record</h2>
    <div id="win-msg"></div>
    <div>Simulation frozen. Coordinates (n, certified s, then x y angle per square):</div>
    <textarea id="win-coords" readonly></textarea>
    <div class="b"><button id="win-copy" class="primary">copy coordinates</button><button id="win-close">unfreeze and continue</button><span id="win-copied" style="color:var(--muted)"></span></div>
  </div>
</div>
<div class="wrap">
  <div>
    <canvas id="cv" width="800" height="800" aria-label="Packing simulation"></canvas>
    <div class="ro">
      <span><span id="state" class="pill st-idle">ready</span></span>
      <span>s <b id="ro-s">–</b></span><span>rec <b id="ro-rec">–</b></span><span>gap <b id="ro-gap">–</b></span>
      <span>best <b id="ro-best">–</b></span><span>fill <b id="ro-phi">–</b></span><span>E <b id="ro-e">–</b></span><span>r <b id="ro-r">–</b></span><span>step <b id="ro-steps">0</b></span>
    </div>
  </div>
  <div class="side">
    <div class="h">run</div>
    <div class="b"><label for="n-in">n</label><input id="n-in" class="num" type="number" min="2" max="120" value="55"><button id="b-new" class="primary">new</button>
      <button id="b-play" aria-pressed="false" title="Space">▶ Play</button><button id="b-step">step</button><button id="b-auto">full run</button><button id="b-best" title="restore the best valid square packing found for this n">best</button></div>
    <div class="r"><label for="speed">steps/frame</label><input id="speed" type="range" min="1" max="30" value="6"><output id="o-speed">6</output></div>

    <div class="h">box</div>
    <div class="r"><label for="wall">wall speed</label><input id="wall" type="range" min="1" max="100" value="45"><output id="o-wall"></output></div>
    <div class="r"><label for="shake">shake</label><input id="shake" type="range" min="0" max="100" value="40"><output id="o-shake"></output></div>
    <div class="b"><label class="c"><input id="fade" type="checkbox" checked>fade</label><label class="c" title="when compression stalls, shake at fixed size before retrying"><input id="settle" type="checkbox" checked>settle</label><label class="c" title="lock squares flush on two adjacent sides with walls or locked squares (2 walls; wall + locked; 2 locked). Locked squares stay tied to those two contacts, permanently."><input id="lock" type="checkbox">lock</label><span class="b" role="group" aria-label="Box mode">box <button data-box="shrink" aria-pressed="true" title="strictly shrinking: walls only move inward">&lt;</button><button data-box="hold" aria-pressed="false" title="hold size: box fixed, shake and re-settle">=</button><button data-box="free" aria-pressed="false" title="free: box size floats, can grow or shrink">~</button></span>
      <button id="b-exp3">+3%</button><button id="b-exp10">+10%</button></div>

    <div class="h">shape</div>
    <div class="r"><label for="round">rounding r</label><input id="round" type="range" min="0" max="50" value="20"><output id="o-round"></output></div>
    <div class="b"><button id="b-harden">harden</button><button id="b-tight">tighten</button></div>
    <div class="b"><label class="c" title="squares keep their angles: no rotation anywhere"><input id="norot" type="checkbox">no rotation</label></div>


    <details class="adv"><summary class="h" style="cursor:pointer">advanced</summary>
      <label class="c" title="squares flush with exactly one wall or locked square may only move outward, toward the edges"><input id="lock-outward" type="checkbox">one anchor: outward only (experimental, can stall)</label>
      <label class="c" title="when fixing overlaps, only slide squares, never turn them"><input id="repair-norot" type="checkbox" checked>repair: no rotate</label>
    </details>
    <div class="h">wind</div>
    <div class="b" style="gap:8px; align-items:flex-start">
      <div class="pad" role="group" aria-label="Wind direction">
        <button data-w="-1,1" aria-pressed="false">↖</button><button data-w="0,1" aria-pressed="false">↑</button><button data-w="1,1" aria-pressed="false">↗</button>
        <button data-w="-1,0" aria-pressed="false">←</button><button data-w="off" aria-pressed="true">·</button><button data-w="1,0" aria-pressed="false">→</button>
        <button data-w="-1,-1" aria-pressed="false">↙</button><button data-w="0,-1" aria-pressed="false">↓</button><button data-w="1,-1" aria-pressed="false">↘</button>
      </div>
      <div class="b" style="flex-direction:column; gap:2px"><button data-w="out" aria-pressed="false">out</button><button data-w="in" aria-pressed="false">in</button><button data-w="seq" aria-pressed="false">20 random</button></div>
    </div>
    <div class="r"><label for="wstr">strength</label><input id="wstr" type="range" min="0" max="100" value="40"><output id="o-wstr"></output></div>
    <div id="wind-now" style="color:var(--muted)">wind: off</div>
  </div>
</div>

  if (h.k >= h.K) { st.harden = null; setState("done"); }
}
function tighten() { ASP = 1; solveJoint(3e3, 3e6, 600); setState(R === 0 ? "done" : "jammed"); draw(); updateReadouts(); }

// ---------- rendering ----------
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let viewL = 10;
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function tiltColor(t) {
  let a = ((t % (Math.PI / 2)) + Math.PI / 2) % (Math.PI / 2); a = Math.min(a, Math.PI / 2 - a) * 180 / Math.PI;   // 0..45
  if (a < 0.6) return css("--flat");
  const stops = [[0, [59, 79, 156]], [12, [123, 63, 143]], [24, [178, 64, 90]], [35, [208, 122, 53]], [45, [222, 170, 70]]];
  for (let k = 1; k < stops.length; k++) if (a <= stops[k][0]) {
    const [a0, c0] = stops[k - 1], [a1, c1] = stops[k], f = (a - a0) / (a1 - a0);
    return `rgb(${c0.map((c, i) => Math.round(c + f * (c1[i] - c))).join(",")})`;
  }

}
function resizeCanvas() { const dpr = window.devicePixelRatio || 1, w = Math.min(cv.clientWidth, cv.clientHeight || cv.clientWidth), px = Math.round(w * dpr); if (cv.width !== px || cv.height !== px) { cv.width = px; cv.height = px; } }
let disp = null, dispASP = 1;   // eased display coordinates and box aspect (visual only)
function snapDisplay() { disp = new Float64Array(z); dispASP = ASP; }
function easeDisplay() {
  if (!disp || disp.length !== z.length) { snapDisplay(); return; }
  const a = 1;   // no interpolation: always draw the exact (valid) end-of-step state
  for (let i = 0; i < n; i++) {
    disp[i] += (z[i] - disp[i]) * a; disp[n + i] += (z[n + i] - disp[n + i]) * a;
    let d = z[2 * n + i] - disp[2 * n + i]; d = ((d + Math.PI / 4) % (Math.PI / 2) + Math.PI / 2) % (Math.PI / 2) - Math.PI / 4;
    disp[2 * n + i] += d * a;
  }

}
function draw() {
  resizeCanvas(); easeDisplay();
  const W = cv.width, L = disp[3 * n] || 1, Lx = L * dispASP, Ly = L / dispASP;
  viewL = Math.max(Lx, Ly) * 1.03;
  const sc = W / viewL, ox = (W - Lx * sc) / 2, oy = (W + Ly * sc) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, W);
  ctx.setTransform(sc, 0, 0, -sc, ox, oy);

  const ink = css("--ink"), sqFill = css("--sq"), sqLock = css("--sqlock"), sqPart = css("--sqpart");
  for (let i = 0; i < n; i++) {
    ctx.save(); ctx.translate(disp[i], disp[n + i]); ctx.rotate(disp[2 * n + i]);
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-0.5, -0.5, 1, 1, Math.max(0, R)); else ctx.rect(-0.5, -0.5, 1, 1);
    ctx.fillStyle = !lockOn ? sqFill : LOCK[i] === 2 ? sqLock : LOCK[i] === 1 ? sqPart : sqFill; ctx.fill(); ctx.lineWidth = 0.025; ctx.strokeStyle = ink; ctx.globalAlpha = 0.55; ctx.stroke(); ctx.restore();
  }
  ctx.lineWidth = 0.06; ctx.strokeStyle = css("--wall"); ctx.strokeRect(0, 0, Lx, Ly);
  if (drag.i >= 0) { ctx.beginPath(); ctx.arc(disp[drag.i], disp[n + drag.i], 0.12, 0, 2 * Math.PI); ctx.fillStyle = css("--accent"); ctx.fill(); }
}
function setState(s) { st.state = s; const el = document.getElementById("state"); el.textContent = { idle: "ready", compress: "compressing", jammed: "jammed", harden: "hardening", done: "squares" }[s]; el.className = "pill st-" + s; }
function updateReadouts() {
  checkRecord(); if (typeof trackBest === "function") trackBest();
  { const b = (typeof BEST !== "undefined") && BEST[n]; const el = document.getElementById("ro-best"); if (el) el.textContent = b ? b.L.toFixed(5) : "–"; }
  const L = z[3 * n], rec = RECORDS[n];
  document.getElementById("ro-s").textContent = L.toFixed(5);
  document.getElementById("ro-rec").textContent = rec ? rec.toFixed(6) : "unknown";
  const gp = document.getElementById("ro-gap");
  if (rec && R === 0) { const d = L - rec; gp.textContent = (d >= 0 ? "+" : "") + d.toFixed(5); gp.style.color = d < 1e-6 ? css("--good") : ""; }
  else gp.textContent = R > 0 ? "harden first" : "–";
  document.getElementById("ro-phi").textContent = (100 * phiNow()).toFixed(1) + "%";
  document.getElementById("ro-e").textContent = energy(z, null).toExponential(1);
  document.getElementById("ro-r").textContent = R.toFixed(3);
  document.getElementById("ro-steps").textContent = st.steps;
  const w = currentWind();
  document.getElementById("wind-now").textContent = wind.mode === "seq" ? `wind: 20 random, now ${w.label || "off"}` : `wind: ${wind.mode === "off" ? "off" : (wind.mode === "dir" ? WIND_OPTS.find(o => o[1] === wind.dx && o[2] === wind.dy)?.[3] : (wind.mode === "out" ? "away from centre" : "toward centre"))}`;
}

// ---------- main loop ----------
function tick() {
  if (st.playing && !frozen) {
    const k = +document.getElementById("speed").value;
    const t0 = performance.now();
    for (let s = 0; s < k && performance.now() - t0 < 40; s++) {
      if (st.state === "harden") { hardenStep(); if (st.state === "done" && st.auto) { tighten(); st.auto = false; } break; }
      resumeIfStopped();                                   // jammed or finished: keep going, retrying with small wall steps
      if (st.state === "idle") setState("compress");
      compressStep();
    }
    updateReadouts();
  }
  draw();
  requestAnimationFrame(tick);
}
function setPlaying(p) { st.playing = p; const b = document.getElementById("b-play"); b.setAttribute("aria-pressed", p); b.textContent = p ? "❚❚ Pause" : "▶ Play"; }

// ---------- controls ----------
const fmt = { wall: () => (wallMax() * 100).toFixed(2) + "%", shake: () => shakeAmp().toFixed(3), 
              round: () => (+document.getElementById("round").value / 100).toFixed(2), wstr: () => windAmp().toFixed(2), speed: () => document.getElementById("speed").value };
for (const id of Object.keys(fmt)) { const el = document.getElementById(id), out = document.getElementById("o-" + id); const upd = () => { if (out) out.textContent = fmt[id](); }; el.addEventListener("input", upd); upd(); }
document.getElementById("wall").addEventListener("input", () => { st.wallStep = Math.min(st.wallStep, wallMax()); });
document.getElementById("b-new").addEventListener("click", newStart);
document.getElementById("n-in").addEventListener("change", newStart);
// live rounding: reshape the current squares; if they no longer fit, let the box grow just enough
function applyRounding() {
  if (st.state === "harden") return;
  userRound = +document.getElementById("round").value;
  const r = userRound / 100;
  if (Math.abs(r - R) < 1e-9) return;
  setR(r);
  if (energy(z, null) > 1e-12) {
    repairing = true;
    lbfgs(z, 400, 1e-16);
    if (energy(z, null) > 1e-12) solveJoint(3e3, 3e6, 400);     // still overlapping: let the box grow until valid
    repairing = false;
  }
  enforceValid();
  if (st.state === "done" && R > 0) setState("jammed");
  if (st.state === "jammed" && R === 0) setState("done");
  updateReadouts(); draw();
}
document.getElementById("round").addEventListener("input", applyRounding);
function resumeIfStopped() {   // from a jammed or finished packing, Play/Step resume compression with a small wall step
  if (st.state === "jammed" || st.state === "done") { st.wallStep = Math.max(st.wallStep, wallMax() * 0.25); setState("compress"); }
}
document.getElementById("b-play").addEventListener("click", () => { if (!st.playing) resumeIfStopped(); setPlaying(!st.playing); });
document.getElementById("b-step").addEventListener("click", () => {
  if (st.state === "harden") hardenStep(); else { resumeIfStopped(); if (st.state === "idle") setState("compress"); compressStep(); }
  updateReadouts(); draw();
});
document.getElementById("b-auto").addEventListener("click", () => { if (st.state === "done") newStart(); st.auto = true; if (st.state === "jammed") startHarden(); setPlaying(true); });
document.getElementById("b-harden").addEventListener("click", () => { startHarden(); setPlaying(true); });
document.getElementById("b-tight").addEventListener("click", tighten);
// expand: scale box and positions together so gaps open evenly; compression can then resume from the looser state
function expandBox(f) {
  if (st.state === "harden") return;
  ASP = 1; z[3 * n] *= f;
  for (let i = 0; i < n; i++) { z[i] *= f; z[n + i] *= f; }
  enforceValid();
  st.wallStep = wallMax(); st.phi0 = Math.min(st.phi0, phiNow());
  if (st.state === "jammed" || st.state === "done") setState("idle");
  updateReadouts(); draw();
}
document.getElementById("b-exp3").addEventListener("click", () => expandBox(1.03));
document.getElementById("b-exp10").addEventListener("click", () => expandBox(1.10));
for (const b of document.querySelectorAll("[data-w]")) b.addEventListener("click", () => {
  const v = b.dataset.w;
  for (const o of document.querySelectorAll("[data-w]")) o.setAttribute("aria-pressed", o === b);
  if (v === "off") wind = { mode: "off" };
  else if (v === "out" || v === "in") wind = { mode: v };
  else if (v === "seq") { wind = { mode: "seq" }; windSeq = Array.from({ length: 20 }, () => WIND_OPTS[Math.floor(Math.random() * WIND_OPTS.length)]); }
  else { const [dx, dy] = v.split(",").map(Number); wind = { mode: "dir", dx, dy }; }
  updateReadouts();
});

// drag squares
const drag = { i: -1 };
function worldPt(ev) {
  const rect = cv.getBoundingClientRect(), dpr = cv.width / rect.width, W = cv.width, L = disp ? disp[3 * n] : z[3 * n], sc = W / viewL;
  const ox = (W - L * dispASP * sc) / 2, oy = (W + L / dispASP * sc) / 2;
  const px = (ev.clientX - rect.left) * dpr, py = (ev.clientY - rect.top) * dpr;
  return [(px - ox) / sc, (oy - py) / sc];
}
cv.addEventListener("pointerdown", ev => {
  const [x, y] = worldPt(ev); let bi = -1, bd = 0.5;
  for (let i = 0; i < n; i++) { const d = Math.hypot(z[i] - x, z[n + i] - y); if (d < bd) { bd = d; bi = i; } }
  if (bi >= 0) { drag.i = bi; drag.dx = z[bi] - x; drag.dy = z[n + bi] - y; drag.was = st.playing; setPlaying(false); cv.setPointerCapture(ev.pointerId); cv.classList.add("dragging"); }
});
cv.addEventListener("pointermove", ev => { if (drag.i < 0) return; const [x, y] = worldPt(ev); z[drag.i] = x + drag.dx; z[n + drag.i] = y + drag.dy; if (disp) { disp[drag.i] = z[drag.i]; disp[n + drag.i] = z[n + drag.i]; } updateReadouts(); });
cv.addEventListener("pointerup", () => {
  if (drag.i < 0) return; drag.i = -1; cv.classList.remove("dragging");
  if (st.state === "done" || st.state === "jammed") solveJoint(3e3, R === 0 ? 3e6 : 3e4, 400); else lbfgs(z, 600, 1e-18);
  enforceValid();
  updateReadouts(); if (drag.was) setPlaying(true);
});
window.addEventListener("resize", draw);


// ---------- record watch: independent check, freeze on a certified improvement ----------
function maxViolation() {   // separating-axis check for true squares (r = 0) in the current square box
  const L = z[3 * n]; let worst = -1e9;
  const V = [];
  for (let i = 0; i < n; i++) {
    const c = Math.cos(z[2 * n + i]), s = Math.sin(z[2 * n + i]), pts = [];
    for (let k = 0; k < 4; k++) { const kx = KX[k] * 0.5, ky = KY[k] * 0.5; pts.push([z[i] + c * kx - s * ky, z[n + i] + s * kx + c * ky]); }
    V.push(pts);
    for (const [x, y] of pts) worst = Math.max(worst, -x, -y, x - L, y - L);
  }
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    if ((z[i] - z[j]) ** 2 + (z[n + i] - z[n + j]) ** 2 >= 2.0001) continue;
    let ov = 1e9;
    for (const t of [z[2 * n + i], z[2 * n + i] + Math.PI / 2, z[2 * n + j], z[2 * n + j] + Math.PI / 2]) {
      const ax = Math.cos(t), ay = Math.sin(t);
      const pi = V[i].map(p => p[0] * ax + p[1] * ay), pj = V[j].map(p => p[0] * ax + p[1] * ay);
      ov = Math.min(ov, Math.max(...pi) - Math.min(...pj), Math.max(...pj) - Math.min(...pi));
    }
    worst = Math.max(worst, ov);
  }

}
let frozen = false, lastClaim = Infinity;   // after dismissing, only a strictly better packing alerts again
function checkRecord() {
  if (frozen || R !== 0 || Math.abs(ASP - 1) > 1e-12) return;
  const rec = RECORDS[n]; if (!rec) return;
  const L = z[3 * n]; if (L >= rec) return;
  const v = maxViolation();
  if (v > 1e-8) return;                      // overlapping or outside the box: not a valid packing, no claim
  const cert = L + 2e-8;                     // tiny safety margin for rounding
  if (cert >= Math.min(rec, lastClaim) - 1e-7) return;
  lastClaim = cert;
  frozen = true; setPlaying(false); st.auto = false; document.body.classList.add("frozen");
  let txt = `n=${n} s=${cert.toFixed(12)} record=${rec}\n`;
  for (let i = 0; i < n; i++) txt += `${z[i].toFixed(12)} ${z[n + i].toFixed(12)} ${z[2 * n + i].toFixed(12)}\n`;
  document.getElementById("win-msg").textContent = `n = ${n}: certified box side ${cert.toFixed(9)} vs known record ${rec}  (better by ${(rec - cert).toExponential(3)}; largest overlap ${v.toExponential(2)})`;
  document.getElementById("win-coords").value = txt;
  try { localStorage.setItem("packing-lab-candidate-" + n + "-" + Date.now(), txt); } catch (e) {}
  document.getElementById("win").hidden = false;
  document.getElementById("win-copy").focus();
}
document.getElementById("win-copy").addEventListener("click", () => {
  const ta = document.getElementById("win-coords"), msg = document.getElementById("win-copied");
  navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = "copied"; }, () => { ta.select(); msg.textContent = "selected: press Ctrl/Cmd+C"; });
});
document.getElementById("win-close").addEventListener("click", () => { document.getElementById("win").hidden = true; document.body.classList.remove("frozen"); frozen = false; });

// space bar: play / pause (not while typing in a text field, not while frozen on a record)
document.addEventListener("keydown", ev => {
  if (ev.code !== "Space" && ev.key !== " ") return;
  const t = ev.target, tag = t && t.tagName;
  if (tag === "TEXTAREA" || (tag === "INPUT" && (t.type === "number" || t.type === "text"))) return;
  ev.preventDefault();
  if (frozen) return;
  if (!st.playing) resumeIfStopped();
  setPlaying(!st.playing);
});

// ---------- best valid square packing per n (kept across starts, saved in this browser) ----------
const BEST = {};
try { Object.assign(BEST, JSON.parse(localStorage.getItem("packing-lab-best") || "{}")); } catch (e) {}
function trackBest() {
  if (R !== 0 || Math.abs(ASP - 1) > 1e-12) return;
  const L = z[3 * n], b = BEST[n];
  if (b && L >= b.L - 1e-10) return;
  if (maxViolation() > 1e-8) return;                       // must be a genuinely valid packing
  BEST[n] = { L, z: Array.from(z) };
  try { localStorage.setItem("packing-lab-best", JSON.stringify(BEST)); } catch (e) {}
}
document.getElementById("b-best").addEventListener("click", () => {
  const b = BEST[n]; if (!b || b.z.length !== z.length) return;
  setPlaying(false); setR(0); ASP = 1; z.set(b.z); PERM = null; LOCK = new Uint8Array(n);
  document.getElementById("round").value = 0; document.getElementById("o-round").textContent = "0.00";
  lastValid = new Float64Array(z); snapDisplay(); setState("done"); updateReadouts(); draw();
});

for (const b of document.querySelectorAll("[data-box]")) b.addEventListener("click", () => {
  boxMode = b.dataset.box;
  for (const o of document.querySelectorAll("[data-box]")) o.setAttribute("aria-pressed", o === b);
  if (boxMode !== "shrink" && (st.state === "jammed" || st.state === "done")) setState("compress");
  if (boxMode === "shrink") st.wallStep = Math.max(st.wallStep, wallMax() * 0.25);
});

document.getElementById("lock").addEventListener("change", () => { computeLocks(); draw(); });
document.getElementById("lock-outward").addEventListener("change", () => { computeLocks(); draw(); });
{ const inner = compressStep; compressStep = function () { stepping = true; try { inner(); } finally { stepping = false; } }; }
newStart();
requestAnimationFrame(tick);
